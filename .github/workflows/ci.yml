# Lint, type-check, and test the scaffold so it stays honest.
name: ci

on:
  push:
    branches: [main]
  pull_request: {}

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install Poetry
        run: pipx install poetry
      - name: Install
        run: poetry install
      - name: Lint
        run: poetry run ruff check src tests
      - name: Type-check
        run: poetry run mypy
      - name: Test
        run: poetry run pytest -q

  node:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Syntax-check action scripts
        run: npm run check
