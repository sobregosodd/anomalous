# Anomalous — collection action (native Node action).
#
# Node is used here (not a composite action) specifically for the main/post
# lifecycle: `post` runs at the end of the job even if a user step failed, which
# is what guarantees the activity dump is always collected. Composite actions do
# not support post steps.
name: "Anomalous — collect"
description: "Start a host-wide runtime activity dump for the job and collect it at the end."
author: "Sebastian Obregoso, Lorenzo Susini"
branding:
  icon: "activity"
  color: "purple"

inputs:
  dump-name:
    description: "Name for the collected activity dump / artifact."
    required: false
    default: "anomalous-dump"
  upload-artifact:
    description: "Whether to upload the collected dump as a build artifact."
    required: false
    default: "true"
  agent-version:
    description: "Datadog Agent version to install for collection (empty = latest)."
    required: false
    default: ""
  model-path:
    description: "Path to a trained model to score the dump against at job end. If the file is absent, analysis is skipped (the dump is still uploaded)."
    required: false
    default: "anomalous-model.joblib"

# TypeScript action: source lives under src/, built with @vercel/ncc into the
# committed dist/ below. `npm run build` regenerates dist/ after editing src/.
runs:
  using: "node20"
  main: "dist/main/index.js"
  post: "dist/post/index.js"
