# Scheduled trainer — builds/updates the behavioural model off the critical path.
#
# This is a REFERENCE workflow. It lives under examples/ so GitHub Actions never
# runs it in this scaffold repo. Copy it into your OWN repo as
# `.github/workflows/anomalous-train.yml` and adjust the schedule and dump
# source to match your setup. Your repo accumulates the collected dumps (from
# the collection action's artifact uploads) that this trainer consumes.
name: train

on:
  schedule:
    - cron: "0 3 * * *" # daily at 03:00 UTC
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  train:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install anomalous
        run: pip install .

      # TODO(train): fetch the activity dumps accumulated across recent runs into
      # ./dumps (artifact download, object store, etc.) before training.
      - name: Train model
        run: anomalous train ./dumps --model-out anomalous-model.joblib

      # TODO(train): publish the model artifact so the analyze action can load it.
      - uses: actions/upload-artifact@v4
        with:
          name: anomalous-model
          path: anomalous-model.joblib
